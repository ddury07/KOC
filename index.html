<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Knights of the Chair Application – Saint Joseph Cathedral</title>
  <style>
    :root {
      --primary: #1a365d;
      --accent: #c53030;
      --bg: #f7fafc;
      --card: #ffffff;
      --border: #e2e8f0;
      --text: #2d3748;
      --muted: #718096;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.5;
      padding: 2rem 1rem;
    }
    .container {
      max-width: 720px;
      margin: 0 auto;
      background: var(--card);
      border-radius: 12px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.08);
      overflow: hidden;
    }
    header {
      background: var(--primary);
      color: white;
      padding: 2rem 1.75rem;
      text-align: center;
    }
    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.02em;
      margin-bottom: 0.25rem;
    }
    header .subtitle {
      font-size: 0.95rem;
      opacity: 0.9;
      font-weight: 400;
    }
    header .org {
      font-size: 0.85rem;
      opacity: 0.75;
      margin-top: 0.5rem;
    }
    form {
      padding: 2rem 1.75rem 2.5rem;
    }
    .section {
      margin-bottom: 2rem;
    }
    .section-title {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--primary);
      border-bottom: 2px solid var(--primary);
      padding-bottom: 0.4rem;
      margin-bottom: 1.25rem;
    }
    .grid {
      display: grid;
      gap: 1rem;
    }
    .grid-2 { grid-template-columns: 1fr 1fr; }
    .grid-3 { grid-template-columns: 1fr 1fr 1fr; }
    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
    }
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.35rem;
      color: var(--text);
    }
    .required::after {
      content: " *";
      color: var(--accent);
    }
    input[type="text"],
    input[type="email"],
    input[type="tel"],
    input[type="number"],
    input[type="date"],
    select,
    textarea {
      width: 100%;
      padding: 0.65rem 0.85rem;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      font-family: inherit;
      transition: border-color 0.15s, box-shadow 0.15s;
      background: #fff;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(26,54,93,0.15);
    }
    textarea {
      min-height: 110px;
      resize: vertical;
    }
    .radio-group, .checkbox-group {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem 1.5rem;
      margin-top: 0.25rem;
    }
    .radio-group label, .checkbox-group label {
      display: flex;
      align-items: center;
      gap: 0.4rem;
      font-weight: 400;
      cursor: pointer;
      margin-bottom: 0;
    }
    .radio-group input, .checkbox-group input {
      width: auto;
      margin: 0;
    }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      margin-top: 0.25rem;
    }
    .requirements {
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 1.25rem 1.5rem;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }
    .requirements ol {
      padding-left: 1.25rem;
    }
    .requirements li {
      margin-bottom: 0.6rem;
    }
    .agreement {
      background: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 8px;
      padding: 1.25rem;
      margin-bottom: 1.5rem;
    }
    .agreement label {
      display: flex;
      align-items: flex-start;
      gap: 0.6rem;
      font-weight: 400;
      cursor: pointer;
    }
    .agreement input {
      margin-top: 0.25rem;
      flex-shrink: 0;
    }
    .btn-row {
      display: flex;
      gap: 1rem;
      justify-content: flex-end;
      margin-top: 1.5rem;
    }
